[package]
name = "the-maid"
version = "0.1.0"
description = "Local-first AI file organizer"
authors = ["The Maid"]
edition = "2021"

[lib]
name = "the_maid_lib"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "the-maid"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
mockito = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1"
shellexpand = "3"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
